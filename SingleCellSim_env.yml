name: SingleCellSim
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - openjdk=17

  # Bioinformatics CLI
  - bioconda::art=2016.06.05
  - bcftools
  - bedtools
  - fastqc
  - gatk4
  - bwa
  - igvtools
  - mosdepth
  - parallel
  - picard
  - samtools
  - seqtk
  - tabix
  - trim-galore
  - vcftools

  # Python
  - biopython
  - cyvcf2
  - h5py
  - matplotlib
  - networkx
  - numpy
  - pandas
  - pysam
  - scikit-learn
  - scipy
  - seaborn
  - toytree
  - tqdm
