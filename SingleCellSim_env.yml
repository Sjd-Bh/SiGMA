name: SingleCellSim
channels:
  - conda-forge
  - bioconda
dependencies:
  # ==========================================
  # Core Language & Runtime
  # ==========================================
  - python=3.8
  - openjdk=11  # Required for GATK4 and Picard

  # ==========================================
  # Bioinformatics Tools
  # ==========================================
  - bbmap
  - bcftools
  - bedtools
  - cutadapt
  - fastqc
  - gatk4
  - mosdepth
  - picard
  - prosolo
  - samtools
  - seqtk
  - tabix
  - trim-galore
  - vcftools

  # ==========================================
  # Python Data Science & ML
  # ==========================================
  - biopython
  - cyvcf2
  - h5py
  - matplotlib
  - networkx
  - numpy
  - pandas
  - pysam
  - scikit-learn
  - scipy
  - seaborn
  - toytree

  # ==========================================
  # R & Bioconductor (For plotting/downstream)
  # ==========================================
  - r-base
  - r-ape
  - r-ggplot2
  - r-tidyverse
  - bioconductor-aneufinder
  - bioconductor-complexheatmap
  - bioconductor-genomicranges

  # ==========================================
  # Utilities (Useful for Bash wrappers)
  # ==========================================
  - jq
  - yq
  - parallel
  - pigz

  # ==========================================
  # Specialized Pip Packages
  # ==========================================
  - pip:
      - arviz
      - coalesce
      - nflows
      - pyknos
      - pyro-ppl
      - sbi
      - torchaudio
      - torchvision
      - xarray
