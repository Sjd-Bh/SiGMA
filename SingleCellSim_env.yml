name: SingleCellSim
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # ==========================================
  # Core Language & Runtime
  # ==========================================
  - python=3.10
  - openjdk=11  # Required for GATK4 and Picard

  # ==========================================
  # Bioinformatics Tools
  # ==========================================
  - bcftools
  - bedtools
  - fastqc
  - gatk4
  - mosdepth
  - picard
  - samtools
  - seqtk
  - tabix
  - trim-galore
  - vcftools

  # ==========================================
  # Python Data Science & ML
  # ==========================================
  - biopython
  - cyvcf2
  - h5py
  - matplotlib
  - networkx
  - numpy
  - pandas
  - pysam
  - scikit-learn
  - scipy
  - seaborn
  - toytree
